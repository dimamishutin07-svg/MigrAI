services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: migr_ai
      POSTGRES_USER: migr_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migr_ai -d migr_ai"]
      interval: 5s
      timeout: 3s
      retries: 20
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://migr_ai:${POSTGRES_PASSWORD:-change_me}@db:5432/migr_ai?sslmode=disable
    volumes:
      - ./knowledge:/app/knowledge:ro
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
